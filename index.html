<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Beat Cover Video</title>
<style>
:root{--acc:rgb(108,123,255);--beat:0}
*{box-sizing:border-box}
body{margin:0;min-height:100vh;padding:22px 18px 40px;color:#eef0f7;font:15px/1.45 "Avenir Next","Segoe UI",system-ui,sans-serif;
  background:radial-gradient(1100px 560px at 50% -8%,color-mix(in srgb,var(--acc) 30%,transparent),transparent 70%),#0a0b12}
.app{max-width:1060px;margin:0 auto}
header{display:flex;align-items:baseline;gap:12px;margin-bottom:16px;flex-wrap:wrap}
h1{margin:0;font-size:26px;font-weight:800;letter-spacing:-.03em}
header span{color:#8b92a8;font-size:14px}
.stage{border-radius:18px;overflow:hidden;line-height:0;border:1px solid rgba(255,255,255,.12);text-align:center;
  box-shadow:0 0 calc(30px + var(--beat)*110px) color-mix(in srgb,var(--acc) 55%,transparent),0 20px 60px rgba(0,0,0,.5)}
canvas{display:block;margin:0 auto;width:auto;height:auto;max-width:100%;max-height:72vh;background:#0c0f16}
.deck{margin-top:16px;display:grid;gap:14px}
.transport{display:flex;align-items:center;gap:14px;padding:12px 14px;border-radius:16px;background:rgba(255,255,255,.05);border:1px solid rgba(255,255,255,.1)}
.pbtn{width:48px;height:48px;border-radius:50%;border:0;background:var(--acc);color:#0a0b12;display:grid;place-items:center;cursor:pointer;flex:none;transition:transform .12s}
.pbtn:active{transform:scale(.92)}
.pbtn:disabled{opacity:.35;cursor:not-allowed}
.pbtn svg{width:20px;height:20px;fill:currentColor}
#seek{flex:1;-webkit-appearance:none;appearance:none;height:6px;border-radius:3px;outline-offset:6px;cursor:pointer;
  background:linear-gradient(90deg,var(--acc) var(--p,0%),rgba(255,255,255,.16) var(--p,0%))}
#seek::-webkit-slider-thumb{-webkit-appearance:none;width:16px;height:16px;border-radius:50%;background:#fff;border:0;box-shadow:0 0 0 4px color-mix(in srgb,var(--acc) 40%,transparent)}
#seek::-moz-range-thumb{width:16px;height:16px;border-radius:50%;background:#fff;border:0}
#time{font-variant-numeric:tabular-nums;color:#a3aac0;font-size:13px;min-width:92px;text-align:right}
.tiles{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:12px}
.tile{display:flex;align-items:center;gap:12px;padding:12px 14px;min-height:72px;border-radius:16px;background:rgba(255,255,255,.05);border:1px solid rgba(255,255,255,.1);cursor:pointer;transition:border-color .15s,background .15s}
.tile:hover,.tile:focus-within{border-color:var(--acc);background:rgba(255,255,255,.08)}
.tile.field{cursor:default;flex-direction:column;align-items:stretch;justify-content:center;gap:4px}
.vh{position:absolute;width:1px;height:1px;opacity:0;overflow:hidden}
.ico{width:46px;height:46px;border-radius:12px;flex:none;display:grid;place-items:center;font-size:20px;color:var(--acc);background:color-mix(in srgb,var(--acc) 16%,transparent);background-size:cover;background-position:center}
.tile b{display:block;font-size:14px}
.tile small,.field label{color:#8b92a8;font-size:12.5px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;display:block;max-width:150px}
.field label{max-width:none}
.wide{grid-column:1/-1}
.sub{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:12px}
.chk{display:flex;gap:16px;flex-wrap:wrap}
.chk label{display:inline-flex;align-items:center;gap:6px;color:#eef0f7;font-size:13.5px;cursor:pointer}
input[type=text],input[type=number],select{width:100%;padding:8px 10px;border-radius:9px;border:1px solid rgba(255,255,255,.14);background:rgba(0,0,0,.3);color:#fff;font:inherit}
.mb{padding:0 12px;border-radius:9px;border:1px solid rgba(255,255,255,.2);background:rgba(255,255,255,.08);color:#eef0f7;font:inherit;font-size:13px;cursor:pointer}
.mb:disabled,input:disabled,select:disabled{opacity:.4;cursor:not-allowed}
input[type=color]{width:100%;height:36px;padding:2px;border-radius:9px;border:1px solid rgba(255,255,255,.14);background:rgba(0,0,0,.3);cursor:pointer}
input[type=range].mini{width:100%;accent-color:var(--acc)}
input[type=checkbox]{accent-color:var(--acc);width:16px;height:16px}
select option{color:#111}
/* while recording: keep the canvas alive for capture but make it invisible and tiny, hide every other thing that repaints */
.rec-on header,.rec-on .deck{display:none}
.rec-on body,body.rec-on{background:#0a0b12}
.rec-on .stage{position:fixed;left:0;top:0;width:2px;height:2px;opacity:0;pointer-events:none;border:0;box-shadow:none;border-radius:0}
.rec-on canvas{width:2px;height:2px;max-width:none;max-height:none}
input:focus-visible,select:focus-visible,button:focus-visible{outline:2px solid var(--acc);outline-offset:2px}
.export{display:flex;align-items:center;gap:12px;flex-wrap:wrap;margin-bottom:16px}
#rec{padding:13px 24px;border:0;border-radius:12px;background:var(--acc);color:#0a0b12;font:inherit;font-weight:800;font-size:16px;cursor:pointer;box-shadow:0 8px 28px color-mix(in srgb,var(--acc) 45%,transparent);transition:transform .12s}
#rec:hover:not(:disabled){transform:translateY(-2px)}
#rec:disabled{opacity:.35;cursor:not-allowed;box-shadow:none}
#cancel{padding:12px 18px;border-radius:12px;border:1px solid rgba(255,255,255,.2);background:transparent;color:#fff;font:inherit;cursor:pointer}
#cancel[hidden]{display:none}
#msg{color:#a3aac0;font-size:13.5px;flex:1;min-width:200px}
#drop{position:fixed;inset:12px;z-index:9;display:none;place-items:center;text-align:center;padding:20px;border-radius:22px;border:3px dashed var(--acc);
  background:color-mix(in srgb,var(--acc) 22%,rgba(8,9,15,.88));font-size:26px;font-weight:800;pointer-events:none}
#drop.on{display:grid}
#drop small{display:block;font-size:14px;font-weight:400;color:#c4c9da;margin-top:6px}
</style>
</head>
<body>
<div id="drop"><div>Drop audio or a cover image<small>Files are sorted automatically. You can drop both at once.</small></div></div>
<div class="app">
  <header><h1>Beat Cover</h1><span>Drag in a track and a cover, pick a look, save the video</span></header>

  <div class="export">
    <button id="rec" disabled>Save as video</button>
    <button id="cancel" hidden>Cancel</button>
    <span id="msg">Drop an audio file to start. Video export records in real time, so keep this tab open and visible until the song ends.</span>
  </div>

  <div class="stage" id="stage"><canvas id="cv" width="1280" height="720"></canvas></div>

  <div class="deck">
    <div class="transport">
      <button class="pbtn" id="play" aria-label="Play" disabled></button>
      <input id="seek" type="range" min="0" max="1000" value="0" disabled aria-label="Seek">
      <span id="time">0:00 / 0:00</span>
    </div>

    <div class="tiles">
      <label class="tile"><input class="vh" id="aud" type="file" accept="audio/*,.mp3,.wav,.m4a,.ogg,.flac" multiple>
        <span class="ico">&#9835;</span><span><b>Audio</b><small id="aname">Choose or drop a file</small></span></label>
      <label class="tile"><input class="vh" id="img" type="file" accept="image/*,audio/*" multiple>
        <span class="ico" id="thumb">&#9635;</span><span><b>Album cover</b><small id="iname">Choose or drop an image</small></span></label>
      <div class="tile field"><label for="title">Album name</label><input id="title" type="text" value="Album Name" maxlength="80"></div>
      <div class="tile field"><label for="font">Title font</label>
        <select id="font">
          <option value='"Avenir Next","Segoe UI",system-ui,sans-serif'>Avenir / Segoe (default)</option>
          <option value='system-ui,-apple-system,Roboto,sans-serif'>System UI</option>
          <option value='Georgia,"Times New Roman",serif'>Georgia (serif)</option>
          <option value='"Times New Roman",Times,serif'>Times</option>
          <option value='"Palatino Linotype","Book Antiqua",Palatino,serif'>Palatino</option>
          <option value='"Trebuchet MS",sans-serif'>Trebuchet</option>
          <option value='Verdana,Geneva,sans-serif'>Verdana</option>
          <option value='Impact,Haettenschweiler,"Arial Narrow Bold",sans-serif'>Impact</option>
          <option value='"Courier New",Courier,monospace'>Courier (mono)</option>
          <option value='"Brush Script MT","Segoe Script",cursive'>Brush Script</option>
        </select></div>
      <div class="tile field"><label for="aspect">Aspect ratio</label>
        <select id="aspect">
          <option value="16:9">Landscape &middot; 16:9 &middot; 1280×720</option>
          <option value="1:1">Square &middot; 1:1 &middot; 1080×1080</option>
          <option value="9:16">Portrait &middot; 9:16 &middot; 1080×1920</option>
        </select></div>
      <div class="tile field"><label for="mode">Animation</label>
        <select id="mode">
          <option value="pulse">Pulse</option>
          <option value="bars">Spectrum bars</option>
          <option value="ring">Ring</option>
          <option value="vinyl">Spinning vinyl</option>
          <option value="shake">Shake and flash</option>
          <option value="particles">Particle burst</option>
          <option value="shock">Shockwave</option>
          <option value="wave">Waveform</option>
          <option value="glitch">Glitch</option>
          <option value="sway">Sway</option>
          <option value="orbit">Orbit</option>
          <option value="bounce">Bounce</option>
          <option value="zoom">Zoom punch</option>
          <option value="flip">Card flip</option>
          <option value="tunnel">Album tunnel</option>
          <option value="echo">Echo ghosts</option>
          <option value="notes">Floating notes</option>
          <option value="spiral">Spiral drift</option>
        </select></div>
      <div class="tile field"><label for="bg">Background</label>
        <select id="bg">
          <option value="cover">Blurred cover</option>
          <option value="aurora">Aurora</option>
          <option value="stars">Starfield</option>
          <option value="grid">Neon grid</option>
          <option value="flow">Gradient flow</option>
          <option value="dark">Dark</option>
          <option value="bokeh">Bokeh drift</option>
          <option value="waves">Wave layers</option>
          <option value="rain">Neon rain</option>
          <option value="plasma">Plasma</option>
          <option value="beams">Spotlight beams</option>
          <option value="fireflies">Fireflies</option>
        </select></div>
      <div class="tile field"><label for="accent">Accent color (auto from cover)</label><input id="accent" type="color" value="#6c7bff"></div>
      <div class="tile field wide"><label>Beat detection &mdash; kicks and bass only</label><div class="sub">
        <div><label for="bsrc">Listen to</label><select id="bsrc">
          <option value="low">Kicks + bass</option>
          <option value="kick">Kicks only</option>
        </select></div>
        <div><label for="bsize">Trigger on</label><select id="bsize">
          <option value="all">Every hit</option>
          <option value="big">Strong hits only</option>
        </select></div>
        <div><label for="bmode">Beat mode</label><select id="bmode">
          <option value="hits">Detected hits</option>
          <option value="manual">BPM grid (manual)</option>
          <option value="auto">BPM grid (auto)</option>
          <option value="live">BPM grid (live, follows halftime)</option>
        </select></div>
        <div><label for="bpm">BPM <span id="bmul"></span></label><div style="display:flex;gap:6px"><input id="bpm" type="number" min="30" max="300" step="0.1" value="120" style="flex:1;min-width:0"><button type="button" class="mb" id="bpm-half" title="Half the BPM (halftime). In auto/live it scales the detected tempo.">&frac12;&times;</button><button type="button" class="mb" id="bpm-dbl" title="Double BPM">2&times;</button></div></div>
        <div><label for="sens">Sensitivity</label><input class="mini" id="sens" type="range" min="2" max="98" step="0.5" value="50"></div>
        <div><label for="gap">Beat spacing</label><input class="mini" id="gap" type="range" min="60" max="600" step="10" value="120"></div>
      </div></div>
      <div class="tile field"><label>Effects</label><div class="chk">
        <label><input type="checkbox" id="fx-flash"> Beat flash</label>
        <label><input type="checkbox" id="fx-grain"> Film grain</label></div></div>
    </div>
  </div>
</div>

<script>
const $ = id => document.getElementById(id);
const cv = $('cv'), ctx = cv.getContext('2d'), stage = $('stage'), root = document.documentElement;
let W = 1280, H = 720;
if (!CanvasRenderingContext2D.prototype.roundRect) CanvasRenderingContext2D.prototype.roundRect = function (x, y, w, h, r) {
  this.moveTo(x + r, y); this.arcTo(x + w, y, x + w, y + h, r); this.arcTo(x + w, y + h, x, y + h, r);
  this.arcTo(x, y + h, x, y, r); this.arcTo(x, y, x + w, y, r); this.closePath();
};
const ICON_PLAY = '<svg viewBox="0 0 24 24"><path d="M7 4v16l13-8z"/></svg>';
const ICON_PAUSE = '<svg viewBox="0 0 24 24"><path d="M6 4h4v16H6zM14 4h4v16h-4z"/></svg>';
$('play').innerHTML = ICON_PLAY;

// ---- aspect ratio ----
const RATIOS = { '16:9': [1280, 720], '1:1': [1080, 1080], '9:16': [1080, 1920] };
function setAspect(key) {
  const [w, h] = RATIOS[key] || RATIOS['16:9'];
  W = w; H = h; cv.width = W; cv.height = H;
}
$('aspect').onchange = e => setAspect(e.target.value);
setAspect($('aspect').value);

let AC, analyser, spk, dest, anaDelay, anaDelayVal = 0, freq, td;
let buf = null, bassBuf = null, kickBuf = null, node = null, startT = 0, offset = 0, playing = false, lastPos = 0;
let img = null, bgThumb = null, bgBlur = null, acc = [108, 123, 255], accH = 235;
let bpmMul = 1, lastBpmUi = 0, lastMsgAt = 0, beat = 0, energy = 0, rot = 0, flipA = 0, parts = [], rings = [], notes = [], sway = 1, gridPhase = 0, lastNow = 0;
let recording = false, rec = null, chunks = [], cancelled = false, seeking = false;
const msg = t => $('msg').textContent = t;
const fmt = s => { s = Math.floor(s || 0); return Math.floor(s / 60) + ':' + String(s % 60).padStart(2, '0'); };
const hs = (h, s, l, a) => `hsla(${((h % 360) + 360) % 360},${s}%,${l}%,${a})`;
const stars = Array.from({ length: 240 }, () => ({ x: Math.random() * 2 - 1, y: Math.random() * 2 - 1, z: Math.random() }));
const bokeh = Array.from({ length: 26 }, () => ({ x: Math.random(), y: Math.random(), r: 22 + Math.random() * 95, sp: .012 + Math.random() * .035, a: .05 + Math.random() * .13, o: Math.random() * 60 }));
const drops = Array.from({ length: 90 }, () => ({ x: Math.random(), y: Math.random(), sp: .5 + Math.random() * 1.1, len: 14 + Math.random() * 46 }));
const flies = Array.from({ length: 40 }, () => ({ x: Math.random(), y: Math.random(), ph: Math.random() * 6.283, sp: .2 + Math.random() * .55, r: 1.4 + Math.random() * 2.8 }));
const gc = document.createElement('canvas'); gc.width = gc.height = 200;
{ const g = gc.getContext('2d'), d = g.createImageData(200, 200);
  for (let i = 0; i < d.data.length; i += 4) { d.data[i] = d.data[i + 1] = d.data[i + 2] = Math.random() * 255; d.data[i + 3] = 255; }
  g.putImageData(d, 0, 0); }
const grainPat = ctx.createPattern(gc, 'repeat');

// ---- audio graph ----
// speaker path:  source -> spk -> (speakers + recorder)
// visual path:   source -> anaDelay -> analyser -> (silent)   (delay lines the spectrum up with what you actually hear)
const ANA_WIN = 0.046;   // analyser window lag (fftSize/2 at 44.1k)
const VIS_LEAD = 0.016;  // one display frame of lead so visuals land on the beat
function ensureAC() {
  if (AC) return;
  AC = new (window.AudioContext || window.webkitAudioContext)({ latencyHint: 'interactive' });
  analyser = AC.createAnalyser();
  analyser.fftSize = 4096;
  analyser.smoothingTimeConstant = 0.2;
  anaDelay = AC.createDelay(1.0);
  anaDelay.delayTime.value = 0;
  spk = AC.createGain();
  dest = AC.createMediaStreamDestination();
  const silent = AC.createGain(); silent.gain.value = 0;
  anaDelay.connect(analyser); analyser.connect(silent); silent.connect(AC.destination);
  spk.connect(AC.destination);
  spk.connect(dest);
  freq = new Uint8Array(analyser.frequencyBinCount);
  td = new Uint8Array(analyser.fftSize);
}

// ---- offline filtering: isolate kick + bass range (mono) ----
// chain = [[type, freq, Q, gain?], ...]
async function filterBuffer(sourceBuf, chain) {
  try {
    const oc = new OfflineAudioContext(1, sourceBuf.length, sourceBuf.sampleRate);
    const src = oc.createBufferSource(); src.buffer = sourceBuf;
    let prev = src;
    for (const [type, f, q, g] of chain) {
      const b = oc.createBiquadFilter(); b.type = type; b.frequency.value = f; b.Q.value = q;
      if (g != null) b.gain.value = g;
      prev.connect(b); prev = b;
    }
    prev.connect(oc.destination);
    src.start(0);
    return await oc.startRendering();
  } catch (err) {
    return sourceBuf;
  }
}
// kicks + bass: 30-150 Hz, 4-pole low-pass
const CHAIN_LOW = [['highpass', 30, .7], ['highpass', 30, .7], ['lowpass', 150, .7], ['lowpass', 150, .7], ['lowpass', 150, .7], ['lowpass', 150, .7]];
// kicks only: 35-100 Hz, 4-pole low-pass, boosted around the kick fundamental
const CHAIN_KICK = [['highpass', 35, .7], ['highpass', 35, .7], ['lowpass', 100, .7], ['lowpass', 100, .7], ['lowpass', 100, .7], ['lowpass', 100, .7], ['peaking', 55, 1.5, 6]];

// ---- playback position = what you HEAR (output latency compensated automatically) ----
function heardCtxTime() {
  if (recording) return AC.currentTime; // recorder taps audio before the speakers
  try {
    const ts = AC.getOutputTimestamp && AC.getOutputTimestamp();
    if (ts && ts.contextTime > 0 && ts.performanceTime > 0) return ts.contextTime + (performance.now() - ts.performanceTime) / 1000;
  } catch (e) {}
  return AC.currentTime - (AC.baseLatency || 0) - (AC.outputLatency || 0);
}
const pos = () => {
  if (!buf) return 0;
  if (!playing) return offset;
  const p = Math.max(offset, Math.min(offset + heardCtxTime() - startT, buf.duration));
  lastPos = Math.max(lastPos, p);
  return lastPos;
};

// ---- player (decoded buffer) ----
function setIcon() { $('play').innerHTML = playing ? ICON_PAUSE : ICON_PLAY; $('play').setAttribute('aria-label', playing ? 'Pause' : 'Play'); }
function stopNode() {
  if (node) { node.onended = null; try { node.stop(); } catch (e) {} try { node.disconnect(); } catch (e) {} node = null; }
}
function play(from) {
  if (!buf) return;
  ensureAC(); AC.resume();
  stopNode();
  const n = node = AC.createBufferSource();
  n.buffer = buf;
  n.connect(spk);
  n.connect(anaDelay);
  offset = from == null ? offset : from;
  lastPos = offset;
  startT = AC.currentTime + 0.05;
  n.start(startT, offset);
  playing = true; setIcon();
  seekBeats(offset);
  n.onended = () => {
    if (node !== n) return;
    stopNode(); playing = false; offset = 0; setIcon();
    if (recording) setTimeout(() => rec.stop(), 400);
  };
}
function pause() { if (!playing) return; offset = pos(); stopNode(); playing = false; setIcon(); }
$('play').onclick = () => playing ? pause() : play();

const seekEl = $('seek');
seekEl.oninput = () => { seeking = true; if (buf) $('time').textContent = fmt(seekEl.value / 1000 * buf.duration) + ' / ' + fmt(buf.duration); };
seekEl.onchange = () => { if (buf) { const t = seekEl.value / 1000 * buf.duration; if (playing) play(t); else offset = t; } seeking = false; };

// ---- offline kick/bass beat map (computed once per track) ----
// Onset function: fast envelope follower vs slow envelope follower on the isolated low band.
// A kick or new bass note makes the fast follower jump far above the slow one; sustained bass doesn't.
const HOP = 128;           // samples per analysis hop (~3 ms)
const ONSET_COMP = 0.015;  // seconds: fire slightly early to cancel filter + detector delay
let fxLow = null, fxKick = null, beats = [], beatIdx = 0;

function pct(arr, q) { const c = Float32Array.from(arr).sort(); return c[Math.min(c.length - 1, Math.floor(c.length * q))] || 0; }
function onsetFn(b) {
  const d = b.getChannelData(0), n = Math.floor(b.length / HOP), dt = HOP / b.sampleRate;
  const p = new Float32Array(n);
  for (let i = 0; i < n; i++) { let m = 0; const o = i * HOP; for (let k = 0; k < HOP; k++) { const a = Math.abs(d[o + k]); if (a > m) m = a; } p[i] = m; }
  const eps = Math.max(1e-5, pct(p, .99) * .03);
  const aFd = 1 - Math.exp(-dt / .03), aSu = 1 - Math.exp(-dt / .12), aSd = 1 - Math.exp(-dt / .25);
  const f = new Float32Array(n); let fast = 0, slow = 0;
  for (let i = 0; i < n; i++) {
    const v = p[i];
    fast = v > fast ? v : fast + (v - fast) * aFd;
    slow += (v - slow) * (v > slow ? aSu : aSd);
    f[i] = Math.max(0, Math.log(fast + eps) - Math.log(slow + eps));
  }
  const norm = pct(f, .99) || 1;
  for (let i = 0; i < n; i++) f[i] /= norm;
  return f;
}
function makeFx(f, sr) {
  const n = f.length, P = new Float64Array(n + 1), P2 = new Float64Array(n + 1);
  for (let i = 0; i < n; i++) { P[i + 1] = P[i] + f[i]; P2[i + 1] = P2[i] + f[i] * f[i]; }
  const fd = new Float32Array(n >> 1);
  for (let i = 0; i < fd.length; i++) fd[i] = Math.max(f[2 * i], f[2 * i + 1]);
  return { f, P, P2, fd, dtd: 2 * HOP / sr, gBpm: null, curve: null };
}
async function analyzeTrack() {
  fxLow = makeFx(onsetFn(bassBuf), bassBuf.sampleRate);
  await new Promise(r => setTimeout(r, 0));
  fxKick = makeFx(onsetFn(kickBuf), kickBuf.sampleRate);
}
function seekBeats(p) {
  let lo = 0, hi = beats.length;
  while (lo < hi) { const m = (lo + hi) >> 1; if (beats[m].t < p) lo = m + 1; else hi = m; }
  beatIdx = lo;
}
const curFx = () => $('bsrc').value === 'kick' ? fxKick : fxLow;
function buildHitBeats(fx) {
  const f = fx.f, P = fx.P, P2 = fx.P2, n = f.length, sr = buf.sampleRate, R = Math.round(1.5 * sr / HOP);
  const sens = +$('sens').value / 100, zT = 2.0 - sens * 1.4, minF = 0.06 + (1 - sens) * 0.2;

    const sr = (150 + beat * 26) * s, sg = ctx.createLinearGradient(0, hz - sr, 0, hz);
    sg.addColorStop(0, hs(accH + 50, 95, 62, 1)); sg.addColorStop(1, hs(accH, 95, 60, 1));
    ctx.save(); ctx.beginPath(); ctx.rect(0, 0, W, hz); ctx.clip(); ctx.fillStyle = sg;
    ctx.beginPath(); ctx.arc(W / 2, hz - 20 * s, sr, 0, Math.PI * 2); ctx.fill(); ctx.restore();
    gridPhase = (gridPhase + dt * (.35 + energy * 2.4 + beat * .9)) % 1;
    ctx.strokeStyle = A(.55); ctx.lineWidth = 2 * s;
    for (let i = 0; i < 14; i++) { const y = hz + Math.pow((i + gridPhase) / 14, 2.2) * (H - hz); ctx.beginPath(); ctx.moveTo(0, y); ctx.lineTo(W, y); ctx.stroke(); }
    for (let i = -14; i <= 14; i++) { ctx.beginPath(); ctx.moveTo(W / 2 + i * (W / 71), hz); ctx.lineTo(W / 2 + i * (W / 6.7), H); ctx.stroke(); }
  } else if (m === 'flow') {
    const ang = t * .18, dx = Math.cos(ang) * W * .7, dy = Math.sin(ang) * H * .7;
    const g = ctx.createLinearGradient(W / 2 - dx, H / 2 - dy, W / 2 + dx, H / 2 + dy);
    g.addColorStop(0, hs(accH, 70, 20 + beat * 10, 1)); g.addColorStop(.5, hs(accH + 45 + Math.sin(t * .4) * 20, 75, 28 + beat * 12, 1)); g.addColorStop(1, hs(accH + 100, 70, 18 + beat * 8, 1));
    ctx.fillStyle = g; ctx.fillRect(0, 0, W, H);
  } else if (m === 'bokeh') {
    ctx.fillStyle = '#08070f'; ctx.fillRect(0, 0, W, H);
    ctx.globalCompositeOperation = 'lighter';
    for (const b of bokeh) {
      b.y -= b.sp * dt * (1 + energy * 2.2);
      if (b.y < -.15) { b.y = 1.15; b.x = Math.random(); }
      const x = b.x * W, y = b.y * H, r = b.r * s * (1 + beat * .3);
      const g = ctx.createRadialGradient(x, y, 0, x, y, r);
      g.addColorStop(0, hs(accH + b.o, 80, 65, b.a + beat * .12));
      g.addColorStop(1, hs(accH + b.o, 80, 65, 0));
      ctx.fillStyle = g; ctx.fillRect(x - r, y - r, r * 2, r * 2);
    }
    ctx.globalCompositeOperation = 'source-over';
  } else if (m === 'waves') {
    const g = ctx.createLinearGradient(0, 0, 0, H);
    g.addColorStop(0, hs(accH, 60, 9, 1)); g.addColorStop(1, hs(accH + 40, 70, 15, 1));
    ctx.fillStyle = g; ctx.fillRect(0, 0, W, H);
    for (let i = 0; i < 5; i++) {
      const yb = H * (.42 + i * .115), amp = (18 + energy * 90 + beat * 50) * s * (1 - i * .1);
      ctx.beginPath(); ctx.moveTo(0, H);
      for (let x = 0; x <= W; x += 8) {
        const y = yb + Math.sin(x * .006 * s + t * (1 + i * .3) + i) * amp + Math.sin(x * .013 + t * 1.7) * amp * .35;
        ctx.lineTo(x, y);
      }
      ctx.lineTo(W, H); ctx.closePath();
      ctx.fillStyle = hs(accH + i * 22, 80, 28 + i * 7, .5); ctx.fill();
    }
  } else if (m === 'rain') {
    ctx.fillStyle = '#05060b'; ctx.fillRect(0, 0, W, H);
    const sp = 1 + energy * 2.2 + beat;
    ctx.lineCap = 'round'; ctx.lineWidth = 2 * s; ctx.strokeStyle = A(.4);
    for (const d of drops) {
      d.y += d.sp * sp * dt * .55;
      if (d.y > 1.1) { d.y = -.1; d.x = Math.random(); }
      const x = d.x * W, y = d.y * H, l = d.len * s;
      ctx.beginPath(); ctx.moveTo(x, y - l); ctx.lineTo(x, y); ctx.stroke();
    }
  } else if (m === 'plasma') {
    drawPlasma(t);
  } else if (m === 'beams') {
    ctx.fillStyle = '#07060c'; ctx.fillRect(0, 0, W, H);
    ctx.save(); ctx.translate(W / 2, H * .42); ctx.globalCompositeOperation = 'lighter';
    const n = 9, spread = .09 + beat * .06, L = Math.hypot(W, H);
    for (let i = 0; i < n; i++) {
      const ang = t * .25 + i / n * Math.PI * 2;
      const g = ctx.createLinearGradient(0, 0, Math.cos(ang) * L, Math.sin(ang) * L);
      g.addColorStop(0, hs(accH + i * 14, 85, 62, .3 + beat * .2));
      g.addColorStop(1, hs(accH + i * 14, 85, 62, 0));
      ctx.fillStyle = g;
      ctx.beginPath(); ctx.moveTo(0, 0); ctx.arc(0, 0, L, ang - spread, ang + spread); ctx.closePath(); ctx.fill();
    }
    ctx.restore();
  } else if (m === 'fireflies') {
    ctx.fillStyle = '#060610'; ctx.fillRect(0, 0, W, H);
    ctx.globalCompositeOperation = 'lighter';
    for (const f of flies) {
      f.ph += dt * f.sp;
      const x = (f.x + Math.sin(f.ph) * .045) * W, y = (f.y + Math.cos(f.ph * .8) * .05) * H;
      const a = Math.min(1, .22 + .4 * (Math.sin(f.ph * 2) * .5 + .5) + beat * .45);
      const r = f.r * s * (1 + beat * .6) * 6;
      const g = ctx.createRadialGradient(x, y, 0, x, y, r);
      g.addColorStop(0, hs(accH + 30, 90, 70, a));
      g.addColorStop(1, hs(accH + 30, 90, 70, 0));
      ctx.fillStyle = g; ctx.fillRect(x - r, y - r, r * 2, r * 2);
    }
    ctx.globalCompositeOperation = 'source-over';
  }
}

// ---- frame ----
function draw(now) {
  const dt = Math.min(.1, (now - (lastNow || now)) / 1000), t = now / 1000; lastNow = now;
  const s = Math.min(W, H) / 720;

  // keep the spectrum visuals aligned with what the speakers are playing
  if (AC && playing) {
    const lag = recording ? 0 : Math.max(0, AC.currentTime - heardCtxTime());
    const want = Math.min(.5, Math.max(0, lag - ANA_WIN));
    if (Math.abs(want - anaDelayVal) > .004) { anaDelayVal = want; anaDelay.delayTime.setTargetAtTime(want, AC.currentTime, .05); }
  }

  const curPos = pos();
  if (playing && !recording && $('bmode').value === 'live' && now - lastBpmUi > 400) {
    const fx = curFx(); lastBpmUi = now;
    if (fx && fx.curve) $('bpm').value = (curveAt(fx.curve, curPos) * bpmMul).toFixed(1);
  }
  const hit = analyze(curPos, dt), mode = $('mode').value;
  ctx.fillStyle = '#0a0b12'; ctx.fillRect(0, 0, W, H);
  drawBG($('bg').value, t, dt, s);

  let cx = W / 2, cy = H / 2 - H * .07, size = 380 * s, round = false, a = 0, gl = 0;
  const cov = {};

  const glow = ctx.createRadialGradient(cx, cy, 80 * s, cx, cy, 560 * s);
  glow.addColorStop(0, A(.22 + beat * .35)); glow.addColorStop(1, A(0));
  ctx.fillStyle = glow; ctx.fillRect(0, 0, W, H);
  if (mode === 'shake') { ctx.fillStyle = `rgba(255,255,255,${beat * .2})`; ctx.fillRect(0, 0, W, H); }
  if ($('fx-flash').checked) { ctx.fillStyle = `rgba(255,255,255,${Math.max(0, beat - .1) * .16})`; ctx.fillRect(0, 0, W, H); }

  // --- per-animation setup ---
  if (mode === 'pulse') size *= 1 + beat * .12;
  if (mode === 'shake') { size *= 1 + beat * .06; cx += (Math.random() - .5) * beat * 28 * s; cy += (Math.random() - .5) * beat * 28 * s; }
  if (mode === 'particles') size *= 1 + beat * .05;
  if (mode === 'glitch') { size *= 1 + beat * .05; gl = beat; cx += (Math.random() - .5) * beat * 14 * s; }
  if (mode === 'sway') { size *= 1 + beat * .07; a = Math.sin(t * 2.2) * .03 + sway * beat * .09; cy += Math.sin(t * 3) * 6 * s; }
  if (mode === 'bounce') { size *= 1 + beat * .05; cy -= beat * 60 * s; cov.sx = 1 - beat * .06; cov.sy = 1 + beat * .08; }
  if (mode === 'zoom') size *= 1 + beat * .22 + energy * .12;
  if (mode === 'flip') { flipA += dt * (playing ? 2.4 + energy * 4 : .6); cov.sx = Math.cos(flipA); cov.sy = 1 + beat * .05; }
  if (mode === 'tunnel') size *= 1 + beat * .05;
  if (mode === 'notes') size *= 1 + beat * .04;
  if (mode === 'spiral') { const r = 70 * s; cx += Math.cos(t * 1.5) * r; cy += Math.sin(t * 1.5) * r; a = t * 1.5; size *= 1 + beat * .06; }

  if (mode === 'bars') {
    size *= 1 + beat * .04;
    const n = 64, bw = W / n;
    for (let i = 0; i < n; i++) {
      const v = freq ? freq[1 + Math.floor(Math.pow(i / n, 1.6) * 600)] / 255 : 0, h = (8 + v * 190) * s;
      const g = ctx.createLinearGradient(0, H - h, 0, H); g.addColorStop(0, A(.9)); g.addColorStop(1, A(.15));
      ctx.fillStyle = g; ctx.beginPath(); ctx.roundRect(i * bw + 3, H - h, bw - 6, h + 8 * s, 5 * s); ctx.fill();
    }
  }
  if (mode === 'ring') {
    round = true; size *= 1 + beat * .03;
    const n = 96, R = size / 2 + 16 * s; ctx.lineWidth = 5 * s; ctx.lineCap = 'round';
    for (let i = 0; i < n; i++) {
      const k = i < n / 2 ? i : n - 1 - i;
      const v = freq ? freq[1 + Math.floor(Math.pow(k / (n / 2), 1.4) * 440)] / 255 : 0;
      const ang = i / n * Math.PI * 2 - Math.PI / 2, l = (6 + v * 100) * s;
      ctx.strokeStyle = i % 2 ? 'rgba(255,255,255,.9)' : A(.95);
      ctx.beginPath(); ctx.moveTo(cx + Math.cos(ang) * R, cy + Math.sin(ang) * R);
      ctx.lineTo(cx + Math.cos(ang) * (R + l), cy + Math.sin(ang) * (R + l)); ctx.stroke();
    }
  }
  if (mode === 'vinyl') {
    round = true; size *= 1 + beat * .03;
    rot += playing ? .012 + energy * .14 : .004; a = rot;
    ctx.fillStyle = '#05070b'; ctx.beginPath(); ctx.arc(cx, cy, size / 2 + 22 * s, 0, Math.PI * 2); ctx.fill();
  }
  if (mode === 'wave') {
    size *= 1 + beat * .05;
    if (analyser && playing) analyser.getByteTimeDomainData(td);
    ctx.beginPath();
    for (let x = 0; x <= W; x += 4) {
      const v = playing && td ? (td[Math.floor(x / W * (td.length - 1))] - 128) / 128 : Math.sin(x / 90 + t * 2) * .04;
      const y = cy + v * 230 * s; x ? ctx.lineTo(x, y) : ctx.moveTo(x, y);
    }
    ctx.lineWidth = 4 * s; ctx.strokeStyle = A(.95); ctx.shadowColor = A(1); ctx.shadowBlur = 22 * s; ctx.stroke();
    ctx.shadowBlur = 0; ctx.lineWidth = 1.5 * s; ctx.strokeStyle = 'rgba(255,255,255,.9)'; ctx.stroke();
  }
  if (mode === 'shock') {
    size *= 1 + beat * .06;
    if (hit) rings.push({ r: size / 2, l: 1, w: hit });
    rings = rings.filter(r => r.l > 0);
    for (const r of rings) {
      r.r += dt * 560 * s; r.l -= dt * 1.1;
      ctx.lineWidth = (2 + r.l * 10 * r.w) * s; ctx.strokeStyle = A(Math.max(r.l, 0) * .85);
      ctx.beginPath(); ctx.arc(cx, cy, r.r, 0, Math.PI * 2); ctx.stroke();
      ctx.lineWidth = 1.5 * s; ctx.strokeStyle = `rgba(255,255,255,${Math.max(r.l, 0) * .6})`;
      ctx.beginPath(); ctx.arc(cx, cy, r.r - 8 * s, 0, Math.PI * 2); ctx.stroke();
    }
  }
  if (mode === 'orbit') {
    size *= 1 + beat * .04;
    for (let i = 0; i < 36; i++) {
      const v = freq ? freq[1 + i * 10] / 255 : 0, ang = i / 36 * Math.PI * 2 + t * .5 * (i % 2 ? 1 : -1), r = size / 2 + (50 + (i % 3) * 34 + v * 50) * s;
      ctx.fillStyle = i % 2 ? 'rgba(255,255,255,.9)' : A(.95);
      ctx.beginPath(); ctx.arc(cx + Math.cos(ang) * r, cy + Math.sin(ang) * r, (3 + v * 8) * s, 0, Math.PI * 2); ctx.fill();
    }
  }

  // --- layered copies behind the main cover ---
  if (mode === 'tunnel') {
    for (let i = 3; i >= 1; i--) {
      const k2 = 1 + i * .24 * (1 + beat * .25);
      cover(cx, cy, size * k2, round, a + i * .06, 0, { alpha: .26 / i });
    }
  }
  if (mode === 'echo') {
    const off = beat * 24 * s;
    ctx.globalCompositeOperation = 'lighter';
    cover(cx - off, cy, size, round, a, 0, { alpha: .32 });
    cover(cx + off, cy, size, round, a, 0, { alpha: .32 });
    ctx.globalCompositeOperation = 'source-over';
  }

  // --- particles / notes ---
  if (hit && mode === 'particles') for (let i = 0, n = 14 + Math.round(34 * hit); i < n; i++) {
    const g = Math.random() * Math.PI * 2, sp = (3 + Math.random() * 8) * s * (.6 + hit * .6);
    parts.push({ x: cx + Math.cos(g) * size / 2, y: cy + Math.sin(g) * size / 2, vx: Math.cos(g) * sp, vy: Math.sin(g) * sp, l: 1, c: Math.random() < .5 });
  }
  parts = parts.filter(p => p.l > 0);
  for (const p of parts) {
    p.x += p.vx; p.y += p.vy; p.vx *= .98; p.vy *= .98; p.l -= dt * 1.2;
    ctx.fillStyle = p.c ? A(Math.max(p.l, 0)) : `rgba(255,255,255,${Math.max(p.l, 0)})`;
    ctx.beginPath(); ctx.arc(p.x, p.y, (2 + p.l * 4) * s, 0, Math.PI * 2); ctx.fill();
  }

  if (hit && mode === 'notes') for (let i = 0, n = 3 + Math.round(6 * hit); i < n; i++) {
    notes.push({ x: cx + (Math.random() - .5) * size * .9, y: cy + (Math.random() - .4) * size * .5, vy: -(40 + Math.random() * 80) * s, ph: Math.random() * 6.283, l: 1, g: Math.random() < .5 ? '♪' : '♫' });
  }
  notes = notes.filter(n => n.l > 0);
  if (notes.length) {
    ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
    ctx.font = `700 ${24 * s}px system-ui,sans-serif`;
    for (const nt of notes) {
      nt.y += nt.vy * dt; nt.x += Math.sin(nt.ph + t * 3) * 22 * s * dt; nt.l -= dt * .5;
      ctx.globalAlpha = Math.max(0, nt.l);
      ctx.fillStyle = A(.95);
      ctx.fillText(nt.g, nt.x, nt.y);
    }
    ctx.globalAlpha = 1;
  }

  // --- main cover ---
  cover(cx, cy, size, round, a, gl, cov);
  if (mode === 'vinyl') { ctx.fillStyle = '#0a0b12'; ctx.beginPath(); ctx.arc(cx, cy, size * .05, 0, Math.PI * 2); ctx.fill(); }

  // --- vignette + grain ---
  const vg = ctx.createRadialGradient(W / 2, H / 2, 300 * s, W / 2, H / 2, 820 * s);
  vg.addColorStop(0, 'rgba(0,0,0,0)'); vg.addColorStop(1, 'rgba(0,0,0,.55)');
  ctx.fillStyle = vg; ctx.fillRect(0, 0, W, H);
  if ($('fx-grain').checked) {
    ctx.save(); ctx.globalAlpha = .09; ctx.translate(Math.random() * 200 | 0, Math.random() * 200 | 0);
    ctx.fillStyle = grainPat; ctx.fillRect(-200, -200, W + 200, H + 200); ctx.restore();
  }

  // --- title ---
  const title = $('title').value || '';
  const ff = $('font').value;
  let fs = 58 * s; const fnt = z => `800 ${z}px ${ff}`;
  ctx.font = fnt(fs);
  while (ctx.measureText(title).width > W - 120 * s && fs > 20 * s) ctx.font = fnt(fs -= 2 * s);
  ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
  ctx.shadowColor = 'rgba(0,0,0,.65)'; ctx.shadowBlur = 16 * s; ctx.fillStyle = '#fff';
  ctx.fillText(title, W / 2, H * .88); ctx.shadowBlur = 0;
  const bw2 = (70 + energy * 520) * s; ctx.fillStyle = A(1);
  ctx.beginPath(); ctx.roundRect(W / 2 - bw2 / 2, H * .936, bw2, 5 * s, 3 * s); ctx.fill();

  const d = buf ? buf.duration : 0;
  if (recording) {
    if (d && now - lastMsgAt > 500) { lastMsgAt = now; msg('Recording… ' + Math.round(curPos / d * 100) + '%. Preview is hidden to keep it smooth. Keep this tab open.'); }
  } else {
    stage.style.setProperty('--beat', Math.min(beat, 1).toFixed(3));
    if (!seeking) { seekEl.value = d ? curPos / d * 1000 : 0; $('time').textContent = fmt(curPos) + ' / ' + fmt(d); }
    seekEl.style.setProperty('--p', (seekEl.value / 10) + '%');
  }
  requestAnimationFrame(draw);
}
requestAnimationFrame(draw);

// ---- video export (60 fps, normal bitrate, current aspect ratio) ----
function setBusy(b) {
  recording = b; document.body.classList.toggle('rec-on', b);
  $('rec').disabled = $('play').disabled = seekEl.disabled = b;
  $('aud').disabled = $('img').disabled = $('aspect').disabled = b;
  $('cancel').hidden = !b;
}
$('rec').onclick = () => {
  if (!buf) return;
  if (!window.MediaRecorder) { msg('This browser cannot record video. Try Chrome, Edge, Firefox or Safari 14.1+.'); return; }
  ensureAC(); AC.resume(); pause(); offset = 0;
  const REC_FPS = 120;
  const bitrate = Math.max(8000000, W * H * REC_FPS * 0.25);
  const types = ['video/mp4;codecs=avc1.42E01E,mp4a.40.2', 'video/webm;codecs=vp9,opus', 'video/webm;codecs=vp8,opus', 'video/webm'];
  const mime = types.find(t => MediaRecorder.isTypeSupported(t)) || '';

  const videoTrack = cv.captureStream(REC_FPS).getVideoTracks()[0];
  const audioTracks = dest.stream.getAudioTracks();
  if (!audioTracks.length) {
    msg('Audio stream unavailable for recording. Please check your audio source.');
    return;
  }
  const stream = new MediaStream([videoTrack, audioTracks[0]]);

  rec = new MediaRecorder(stream, mime ? { mimeType: mime, videoBitsPerSecond: bitrate } : { videoBitsPerSecond: bitrate });
  chunks = []; cancelled = false;
  rec.ondataavailable = e => { if (e.data.size) chunks.push(e.data); };
  rec.onstop = () => {
    setBusy(false);
    if (cancelled) { msg('Export cancelled.'); return; }
    const type = rec.mimeType || mime || 'video/webm', ext = type.includes('mp4') ? 'mp4' : 'webm';
    const name = ($('title').value.replace(/[^\w\- ]+/g, '').trim() || 'album') + '.' + ext;
    const a = document.createElement('a'); a.href = URL.createObjectURL(new Blob(chunks, { type })); a.download = name; a.click();
    msg('Saved ' + name + '.');
  };
  // pre-warm: hide the UI and let the canvas settle for a moment BEFORE recording starts,
  // then start the recorder and the audio together on the recorder's own start event
  setBusy(true); lastMsgAt = performance.now() + 3000; msg("Getting ready… recording starts in 3 seconds");
  anaDelay.delayTime.cancelScheduledValues(0); anaDelay.delayTime.value = 0; anaDelayVal = 0;
  setTimeout(async () => {
    if (cancelled) return;
    try { await AC.resume(); rec.start(500); play(0); }
    catch (err) { cancelled = true; pause(); try { rec.stop(); } catch (e) { rec.onstop(); } msg('Could not start recording: ' + (err && err.message || err)); }
  }, 3000);
};
$('cancel').onclick = () => { cancelled = true; pause(); if (rec.state !== 'inactive') rec.stop(); else rec.onstop(); };
</script>
</body>
</html>
