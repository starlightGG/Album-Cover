<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Beat Cover Video</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Abril+Fatface&family=Anton&family=Archivo+Black&family=Audiowide&family=Bangers&family=Bebas+Neue&family=Bungee&family=Caveat:wght@700&family=Cinzel:wght@800&family=Dancing+Script:wght@700&family=Lobster&family=Monoton&family=Orbitron:wght@800&family=Oswald:wght@700&family=Pacifico&family=Permanent+Marker&family=Playfair+Display:wght@800&family=Press+Start+2P&family=Righteous&family=Rubik+Mono+One&family=Space+Grotesk:wght@700&family=Special+Elite&display=swap">
<style>
:root{--acc:rgb(108,123,255);--beat:0}
*{box-sizing:border-box}
body{margin:0;min-height:100vh;padding:22px 18px 40px;color:#eef0f7;font:15px/1.45 "Avenir Next","Segoe UI",system-ui,sans-serif;
  background:radial-gradient(1100px 560px at 50% -8%,color-mix(in srgb,var(--acc) 30%,transparent),transparent 70%),#0a0b12}
.app{max-width:1060px;margin:0 auto}
header{display:flex;align-items:baseline;gap:12px;margin-bottom:16px;flex-wrap:wrap}
h1{margin:0;font-size:26px;font-weight:800;letter-spacing:-.03em}
header span{color:#8b92a8;font-size:14px}
.stage{border-radius:18px;overflow:hidden;line-height:0;border:1px solid rgba(255,255,255,.12);text-align:center;
  box-shadow:0 0 calc(30px + var(--beat)*110px) color-mix(in srgb,var(--acc) 55%,transparent),0 20px 60px rgba(0,0,0,.5)}
canvas{display:block;margin:0 auto;width:auto;height:auto;max-width:100%;max-height:72vh;background:#0c0f16}
.deck{margin-top:16px;display:grid;gap:14px}
.transport{display:flex;align-items:center;gap:14px;padding:12px 14px;border-radius:16px;background:rgba(255,255,255,.05);border:1px solid rgba(255,255,255,.1)}
.pbtn{width:48px;height:48px;border-radius:50%;border:0;background:var(--acc);color:#0a0b12;display:grid;place-items:center;cursor:pointer;flex:none;transition:transform .12s}
.pbtn:active{transform:scale(.92)}
.pbtn:disabled{opacity:.35;cursor:not-allowed}
.pbtn svg{width:20px;height:20px;fill:currentColor}
#seek{flex:1;-webkit-appearance:none;appearance:none;height:6px;border-radius:3px;outline-offset:6px;cursor:pointer;
  background:linear-gradient(90deg,var(--acc) var(--p,0%),rgba(255,255,255,.16) var(--p,0%))}
#seek::-webkit-slider-thumb{-webkit-appearance:none;width:16px;height:16px;border-radius:50%;background:#fff;border:0;box-shadow:0 0 0 4px color-mix(in srgb,var(--acc) 40%,transparent)}
#seek::-moz-range-thumb{width:16px;height:16px;border-radius:50%;background:#fff;border:0}
#time{font-variant-numeric:tabular-nums;color:#a3aac0;font-size:13px;min-width:92px;text-align:right}
.tiles{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:12px}
.tile{display:flex;align-items:center;gap:12px;padding:12px 14px;min-height:72px;border-radius:16px;background:rgba(255,255,255,.05);border:1px solid rgba(255,255,255,.1);cursor:pointer;transition:border-color .15s,background .15s}
.tile:hover,.tile:focus-within{border-color:var(--acc);background:rgba(255,255,255,.08)}
.tile.field{cursor:default;flex-direction:column;align-items:stretch;justify-content:center;gap:4px}
.vh{position:absolute;width:1px;height:1px;opacity:0;overflow:hidden}
.ico{width:46px;height:46px;border-radius:12px;flex:none;display:grid;place-items:center;font-size:20px;color:var(--acc);background:color-mix(in srgb,var(--acc) 16%,transparent);background-size:cover;background-position:center}
.tile b{display:block;font-size:14px}
.tile small,.field label{color:#8b92a8;font-size:12.5px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;display:block;max-width:150px}
.field label{max-width:none}
.wide{grid-column:1/-1}
.sub{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:12px}
.chk{display:flex;gap:16px;flex-wrap:wrap}
.chk label{display:inline-flex;align-items:center;gap:6px;color:#eef0f7;font-size:13.5px;cursor:pointer}
input[type=text],input[type=number],select{width:100%;padding:8px 10px;border-radius:9px;border:1px solid rgba(255,255,255,.14);background:rgba(0,0,0,.3);color:#fff;font:inherit}
.mb{padding:0 12px;border-radius:9px;border:1px solid rgba(255,255,255,.2);background:rgba(255,255,255,.08);color:#eef0f7;font:inherit;font-size:13px;cursor:pointer}
.mb:disabled,input:disabled,select:disabled{opacity:.4;cursor:not-allowed}
input[type=color]{width:100%;height:36px;padding:2px;border-radius:9px;border:1px solid rgba(255,255,255,.14);background:rgba(0,0,0,.3);cursor:pointer}
input[type=range].mini{width:100%;accent-color:var(--acc)}
input[type=checkbox]{accent-color:var(--acc);width:16px;height:16px}
select option{color:#111}
/* while recording: keep the canvas alive for capture but make it invisible and tiny, hide every other thing that repaints */
.rec-on header,.rec-on .deck{display:none}
.rec-on body,body.rec-on{background:#0a0b12}
.rec-on .stage{position:fixed;left:0;top:0;width:2px;height:2px;opacity:0;pointer-events:none;border:0;box-shadow:none;border-radius:0}
.rec-on canvas{width:2px;height:2px;max-width:none;max-height:none}
input:focus-visible,select:focus-visible,button:focus-visible{outline:2px solid var(--acc);outline-offset:2px}
.tabbar{display:flex;gap:6px;padding:4px;border-radius:12px;background:rgba(0,0,0,.28);align-self:flex-start;margin-bottom:6px}
.tab{padding:8px 18px;border:0;border-radius:9px;background:transparent;color:#a3aac0;font:inherit;font-weight:700;cursor:pointer;transition:background .15s,color .15s}
.tab:hover{color:#fff}
.tab.on{background:var(--acc);color:#0a0b12}
.dd{position:relative}
.ddbtn{width:100%;display:flex;justify-content:space-between;align-items:center;gap:10px;padding:11px 14px;border-radius:12px;border:1px solid rgba(255,255,255,.14);background:rgba(0,0,0,.3);color:#fff;font:inherit;font-weight:600;cursor:pointer;text-align:left}
.ddbtn:hover,.dd.open .ddbtn{border-color:var(--acc)}
.ddbtn .car{transition:transform .15s;color:#a3aac0}
.dd.open .car{transform:rotate(180deg)}
.ddmenu{display:none;position:absolute;left:0;right:0;top:calc(100% + 6px);z-index:20;padding:10px;border-radius:14px;background:#12141f;border:1px solid rgba(255,255,255,.16);box-shadow:0 18px 50px rgba(0,0,0,.6);grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:8px;max-height:60vh;overflow:auto}
.dd.open .ddmenu{display:grid}
.field .chip{position:relative;display:flex;align-items:center;justify-content:center;text-align:center;padding:9px 10px;border-radius:10px;border:1px solid rgba(255,255,255,.14);background:rgba(255,255,255,.05);color:#eef0f7;font-size:13.5px;cursor:pointer;max-width:none;white-space:normal;user-select:none;transition:background .12s,border-color .12s}
.field .chip:hover{border-color:var(--acc)}
.field .chip input{position:absolute;opacity:0;pointer-events:none}
.field .chip:has(input:checked){background:var(--acc);border-color:var(--acc);color:#0a0b12;font-weight:700}
.field .chip:has(input:focus-visible){outline:2px solid var(--acc);outline-offset:2px}
.export{display:flex;align-items:center;gap:12px;flex-wrap:wrap;margin-bottom:16px}
#rec,#share{padding:13px 24px;border:0;border-radius:12px;background:var(--acc);color:#0a0b12;font:inherit;font-weight:800;font-size:16px;cursor:pointer;box-shadow:0 8px 28px color-mix(in srgb,var(--acc) 45%,transparent);transition:transform .12s}
#share[hidden]{display:none}
#rec:hover:not(:disabled){transform:translateY(-2px)}
#rec:disabled{opacity:.35;cursor:not-allowed;box-shadow:none}
#cancel{padding:12px 18px;border-radius:12px;border:1px solid rgba(255,255,255,.2);background:transparent;color:#fff;font:inherit;cursor:pointer}
#cancel[hidden]{display:none}
#msg{color:#a3aac0;font-size:13.5px;flex:1;min-width:200px}
#drop{position:fixed;inset:12px;z-index:9;display:none;place-items:center;text-align:center;padding:20px;border-radius:22px;border:3px dashed var(--acc);
  background:color-mix(in srgb,var(--acc) 22%,rgba(8,9,15,.88));font-size:26px;font-weight:800;pointer-events:none}
#drop.on{display:grid}
#drop small{display:block;font-size:14px;font-weight:400;color:#c4c9da;margin-top:6px}
</style>
</head>
<body>
<div id="drop"><div>Drop audio or a cover image<small>Files are sorted automatically. You can drop both at once.</small></div></div>
<div class="app">
  <header><h1>Beat Cover</h1><span>Drag in a track and a cover, pick a look, save the video</span></header>

  <div class="export">
    <button id="rec" disabled>Save as video</button>
    <button id="cancel" hidden>Cancel</button>
    <button id="share" hidden>Save / Share video</button>
    <span id="msg">Drop an audio file to start. Video export records in real time, so keep this tab open and visible until the song ends.</span>
  </div>

  <div class="stage" id="stage"><canvas id="cv" width="1280" height="720"></canvas></div>

  <div class="deck">
    <div class="transport">
      <button class="pbtn" id="play" aria-label="Play" disabled></button>
      <input id="seek" type="range" min="0" max="1000" value="0" disabled aria-label="Seek">
      <span id="time">0:00 / 0:00</span>
    </div>

    <div class="tiles">
      <label class="tile"><input class="vh" id="aud" type="file" accept="audio/*,.mp3,.wav,.m4a,.ogg,.flac" multiple>
        <span class="ico">&#9835;</span><span><b>Audio</b><small id="aname">Choose or drop a file</small></span></label>
      <label class="tile"><input class="vh" id="img" type="file" accept="image/*,audio/*" multiple>
        <span class="ico" id="thumb">&#9635;</span><span><b>Album cover</b><small id="iname">Choose or drop an image</small></span></label>
      <div class="tile field"><label for="title">Album name</label><input id="title" type="text" value="Album Name" maxlength="80"></div>
      <div class="tile field"><label for="author">Author name (leave empty to hide)</label><input id="author" type="text" value="Author Name" maxlength="80"></div>
      <div class="tile field"><label for="font">Title font</label>
        <select id="font">
          <option value='"Avenir Next","Segoe UI",system-ui,sans-serif' data-w="800">Avenir / Segoe (default)</option>
          <option value='system-ui,-apple-system,Roboto,sans-serif' data-w="800">System UI</option>
          <option value='Arial,Helvetica,sans-serif' data-w="800">Arial</option>
          <option value='"Arial Black","Arial Bold",Gadget,sans-serif' data-w="400">Arial Black</option>
          <option value='Tahoma,Geneva,sans-serif' data-w="800">Tahoma</option>
          <option value='"Trebuchet MS",sans-serif' data-w="800">Trebuchet</option>
          <option value='Verdana,Geneva,sans-serif' data-w="800">Verdana</option>
          <option value='"Century Gothic",Futura,"Trebuchet MS",sans-serif' data-w="800">Century Gothic / Futura</option>
          <option value='"Gill Sans","Gill Sans MT",Calibri,sans-serif' data-w="800">Gill Sans</option>
          <option value='Optima,Candara,"Segoe UI",sans-serif' data-w="800">Optima / Candara</option>
          <option value='Impact,Haettenschweiler,"Arial Narrow Bold",sans-serif' data-w="400">Impact</option>
          <option value='Georgia,"Times New Roman",serif' data-w="800">Georgia (serif)</option>
          <option value='"Times New Roman",Times,serif' data-w="800">Times</option>
          <option value='"Palatino Linotype","Book Antiqua",Palatino,serif' data-w="800">Palatino</option>
          <option value='Garamond,"Hoefler Text","Times New Roman",serif' data-w="800">Garamond</option>
          <option value='Baskerville,"Baskerville Old Face","Times New Roman",serif' data-w="800">Baskerville</option>
          <option value='Didot,"Bodoni MT","Times New Roman",serif' data-w="800">Didot / Bodoni</option>
          <option value='Rockwell,"Courier Bold",serif' data-w="800">Rockwell (slab)</option>
          <option value='Copperplate,"Copperplate Gothic Light",fantasy' data-w="700">Copperplate</option>
          <option value='"Courier New",Courier,monospace' data-w="800">Courier (mono)</option>
          <option value='"Lucida Console",Monaco,monospace' data-w="800">Lucida Console / Monaco</option>
          <option value='"Brush Script MT","Segoe Script",cursive' data-w="800">Brush Script</option>
          <option value='"Comic Sans MS","Comic Sans",cursive' data-w="800">Comic Sans</option>
          <option value='"Marker Felt","Segoe Print","Bradley Hand",cursive' data-w="800">Marker Felt / Segoe Print</option>
          <option value='Papyrus,fantasy' data-w="800">Papyrus</option>
          <option value='"Anton",Impact,sans-serif' data-w="400">Anton (web)</option>
          <option value='"Bebas Neue",Impact,sans-serif' data-w="400">Bebas Neue (web)</option>
          <option value='"Oswald",Impact,sans-serif' data-w="700">Oswald (web)</option>
          <option value='"Archivo Black",Arial,sans-serif' data-w="400">Archivo Black (web)</option>
          <option value='"Space Grotesk",Arial,sans-serif' data-w="700">Space Grotesk (web)</option>
          <option value='"Righteous",Arial,sans-serif' data-w="400">Righteous (web)</option>
          <option value='"Audiowide",Arial,sans-serif' data-w="400">Audiowide (web)</option>
          <option value='"Orbitron",Arial,sans-serif' data-w="800">Orbitron (web)</option>
          <option value='"Bungee",Impact,sans-serif' data-w="400">Bungee (web)</option>
          <option value='"Rubik Mono One",Impact,sans-serif' data-w="400">Rubik Mono One (web)</option>
          <option value='"Monoton",Impact,cursive' data-w="400">Monoton neon (web)</option>
          <option value='"Press Start 2P","Courier New",monospace' data-w="400">Press Start 2P pixel (web)</option>
          <option value='"Special Elite","Courier New",monospace' data-w="400">Special Elite typewriter (web)</option>
          <option value='"Playfair Display",Georgia,serif' data-w="800">Playfair Display (web)</option>
          <option value='"Abril Fatface",Georgia,serif' data-w="400">Abril Fatface (web)</option>
          <option value='"Cinzel",Georgia,serif' data-w="800">Cinzel (web)</option>
          <option value='"Pacifico","Brush Script MT",cursive' data-w="400">Pacifico (web)</option>
          <option value='"Lobster","Brush Script MT",cursive' data-w="400">Lobster (web)</option>
          <option value='"Dancing Script","Brush Script MT",cursive' data-w="700">Dancing Script (web)</option>
          <option value='"Caveat","Segoe Print",cursive' data-w="700">Caveat handwriting (web)</option>
          <option value='"Permanent Marker","Marker Felt",cursive' data-w="400">Permanent Marker (web)</option>
          <option value='"Bangers",Impact,cursive' data-w="400">Bangers comic (web)</option>
        </select></div>
      <div class="tile field"><label for="aspect">Aspect ratio</label>
        <select id="aspect">
          <option value="16:9">Landscape &middot; 16:9 &middot; 1280×720</option>
          <option value="1:1">Square &middot; 1:1 &middot; 1080×1080</option>
          <option value="9:16">Portrait &middot; 9:16 &middot; 1080×1920</option>
        </select></div>
      <div class="tile field wide">
        <div class="tabbar" role="tablist"><button type="button" class="tab on" id="tabbtn-anim" role="tab" aria-selected="true" data-tab="anim">Animation</button><button type="button" class="tab" id="tabbtn-fx" role="tab" aria-selected="false" data-tab="fx">Effects</button></div>
        <div id="tab-anim" role="tabpanel"><div class="dd"><button type="button" class="ddbtn" aria-expanded="false" aria-haspopup="true"><span id="ddl-anim"></span><span class="car">&#9662;</span></button><div class="ddmenu" id="modes"></div></div></div>
        <div id="tab-fx" role="tabpanel" hidden><div class="dd"><button type="button" class="ddbtn" aria-expanded="false" aria-haspopup="true"><span id="ddl-fx"></span><span class="car">&#9662;</span></button><div class="ddmenu" id="fxmenu"></div></div></div>
      </div>
      <div class="tile field"><label for="bg">Background</label>
        <select id="bg">
          <option value="cover">Blurred cover</option>
          <option value="aurora">Aurora</option>
          <option value="stars">Starfield</option>
          <option value="grid">Neon grid</option>
          <option value="flow">Gradient flow</option>
          <option value="dark">Dark</option>
          <option value="bokeh">Bokeh drift</option>
          <option value="waves">Wave layers</option>
          <option value="rain">Neon rain</option>
          <option value="plasma">Plasma</option>
          <option value="beams">Spotlight beams</option>
          <option value="fireflies">Fireflies</option>
        </select></div>
      <div class="tile field"><label for="accent">Accent color (auto from cover)</label><input id="accent" type="color" value="#6c7bff"></div>
      <div class="tile field wide"><label>Beat detection &mdash; kicks and bass only</label><div class="sub">
        <div><label for="bsrc">Listen to</label><select id="bsrc">
          <option value="low">Kicks + bass</option>
          <option value="kick">Kicks only</option>
        </select></div>
        <div><label for="bsize">Trigger on</label><select id="bsize">
          <option value="all">Every hit</option>
          <option value="big">Strong hits only</option>
        </select></div>
        <div><label for="bmode">Beat mode</label><select id="bmode">
          <option value="hits">Detected hits</option>
          <option value="manual">BPM grid (manual)</option>
          <option value="auto">BPM grid (auto)</option>
          <option value="live">BPM grid (live, follows halftime)</option>
        </select></div>
        <div><label for="bpm">BPM <span id="bmul"></span></label><div style="display:flex;gap:6px"><input id="bpm" type="number" min="30" max="300" step="0.1" value="120" style="flex:1;min-width:0"><button type="button" class="mb" id="bpm-half" title="Half the BPM (halftime). In auto/live it scales the detected tempo.">&frac12;&times;</button><button type="button" class="mb" id="bpm-dbl" title="Double BPM">2&times;</button></div></div>
        <div><label for="sens">Sensitivity</label><input class="mini" id="sens" type="range" min="2" max="98" step="0.5" value="50"></div>
        <div><label for="gap">Beat spacing</label><input class="mini" id="gap" type="range" min="60" max="600" step="10" value="120"></div>
      </div></div>
    </div>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/mp4-muxer@5.2.1/build/mp4-muxer.js"></script>
<script>
const $ = id => document.getElementById(id);
const cv = $('cv'), ctx = cv.getContext('2d'), stage = $('stage'), root = document.documentElement;
let W = 1280, H = 720;
if (!CanvasRenderingContext2D.prototype.roundRect) CanvasRenderingContext2D.prototype.roundRect = function (x, y, w, h, r) {
  this.moveTo(x + r, y); this.arcTo(x + w, y, x + w, y + h, r); this.arcTo(x + w, y + h, x, y + h, r);
  this.arcTo(x, y + h, x, y, r); this.arcTo(x, y, x + w, y, r); this.closePath();
};
const ICON_PLAY = '<svg viewBox="0 0 24 24"><path d="M7 4v16l13-8z"/></svg>';
const ICON_PAUSE = '<svg viewBox="0 0 24 24"><path d="M6 4h4v16H6zM14 4h4v16h-4z"/></svg>';
$('play').innerHTML = ICON_PLAY;

// ---- animations (combine any number) ----
const MODES = [['still','No animation (bg pulse only)'],['pulse','Pulse'],['bars','Spectrum bars'],['ring','Ring'],['vinyl','Spinning vinyl'],['shake','Shake and flash'],['particles','Particle burst'],['shock','Shockwave'],['wave','Waveform'],['glitch','Glitch'],['sway','Sway'],['orbit','Orbit'],['bounce','Bounce'],['zoom','Zoom punch'],['flip','Card flip'],['tunnel','Album tunnel'],['echo','Echo ghosts'],['notes','Floating notes'],['spiral','Spiral drift']];
let modes = new Set(['pulse']);
const has = m => modes.has(m);
const FX = [['fx-flash','Beat flash'],['fx-color','Accent flash'],['fx-strobe','Strobe'],['fx-invert','Invert hit'],['fx-flicker','Film flicker'],['fx-grain','Film grain'],['fx-scan','CRT scanlines'],['fx-vig','Pulsing vignette'],['fx-bars','Cinema bars'],['fx-sparks','Sparkles'],['fx-cam','Camera shake'],['fx-rgb','RGB split'],['fx-pix','Pixelate hit']];
$('modes').innerHTML = MODES.map(([v, n]) => `<label class="chip"><input type="checkbox" data-mode="${v}"${v === 'pulse' ? ' checked' : ''}>${n}</label>`).join('');
$('fxmenu').innerHTML = FX.map(([id, n]) => `<label class="chip"><input type="checkbox" id="${id}">${n}</label>`).join('');
const sumLabel = (menu, none) => {
  const n = [...menu.querySelectorAll('input:checked')].map(i => i.parentElement.textContent.trim());
  return !n.length ? none : n.length <= 2 ? n.join(' + ') : n.slice(0, 2).join(', ') + ' +' + (n.length - 2) + ' more';
};
const refreshDd = () => { $('ddl-anim').textContent = sumLabel($('modes'), 'None selected'); $('ddl-fx').textContent = sumLabel($('fxmenu'), 'None'); };
const NO_ANIM_MSG = 'Pick at least one animation to play or save.';
let loadingAudio = false;
function syncGate() {
  if (recording || loadingAudio) return;
  const dis = !buf || !modes.size;
  $('play').disabled = $('rec').disabled = seekEl.disabled = dis;
  if (buf && !modes.size) { if (playing) pause(); msg(NO_ANIM_MSG); }
  else if (buf && $('msg').textContent === NO_ANIM_MSG) msg('Ready. Press play to preview, then Save as video.');
}
$('modes').onchange = () => { modes = new Set([...$('modes').querySelectorAll('input:checked')].map(i => i.dataset.mode)); refreshDd(); syncGate(); };
$('fxmenu').onchange = refreshDd;
const closeDd = () => document.querySelectorAll('.dd.open').forEach(d => { d.classList.remove('open'); d.querySelector('.ddbtn').setAttribute('aria-expanded', 'false'); });
document.querySelectorAll('.ddbtn').forEach(b => b.onclick = e => {
  e.stopPropagation(); const dd = b.parentElement, o = !dd.classList.contains('open'); closeDd();
  dd.classList.toggle('open', o); b.setAttribute('aria-expanded', o);
});
document.addEventListener('click', e => { if (!e.target.closest('.dd')) closeDd(); });
document.addEventListener('keydown', e => { if (e.key === 'Escape') closeDd(); });
document.querySelectorAll('.tab').forEach(t => t.onclick = () => {
  closeDd();
  document.querySelectorAll('.tab').forEach(x => { const on = x === t; x.classList.toggle('on', on); x.setAttribute('aria-selected', on); $('tab-' + x.dataset.tab).hidden = !on; });
});
refreshDd();

  // then start the recorder and the audio together on the recorder's own start event
  setBusy(true); lastMsgAt = performance.now() + 3000; msg("Getting ready… recording starts in 3 seconds");
  anaDelay.delayTime.cancelScheduledValues(0); anaDelay.delayTime.value = 0; anaDelayVal = 0;
  setTimeout(async () => {
    if (cancelled) return;
    try { await AC.resume(); rec.start(500); play(0); }
    catch (err) { cancelled = true; pause(); try { rec.stop(); } catch (e) { rec.onstop(); } msg('Could not start recording: ' + (err && err.message || err)); }
  }, 3000);
};
$('cancel').onclick = () => { cancelled = true; if (offline) return; pause(); if (rec.state !== 'inactive') rec.stop(); else rec.onstop(); };
</script>
